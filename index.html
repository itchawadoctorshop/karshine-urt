<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิวรับบริการ - Karshine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 280px; width: 100%; border-radius: 12px; z-index: 1; }
    .checkbox-custom:checked + div { border-color: #3b82f6; background-color: #eff6ff; }
    .checkbox-custom:checked + div .check-icon { display: block; }
    /* ปรับแต่ง SweetAlert สำหรับโชว์เวลา */
    .swal-time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; max-height: 50vh; overflow-y: auto; padding: 5px; }
    .time-btn { border: 2px solid #93c5fd; background: white; color: #2563eb; padding: 10px; border-radius: 10px; font-weight: bold; transition: 0.2s; }
    .time-btn:hover, .time-btn:active { background: #2563eb; color: white; border-color: #2563eb; }
  </style>
</head>
<body class="bg-gray-100 pb-24 font-sans">
  <div class="bg-blue-600 text-white p-6 rounded-b-[2.5rem] shadow-lg mb-6">
    <h1 class="text-2xl font-bold text-center">จองคิวเข้ารับบริการ</h1>
    <p class="text-center text-blue-100 text-sm mt-1">สะดวกรวดเร็ว สรุปยอดทันที</p>
  </div>

  <div class="max-w-md mx-auto px-4" id="app-container">
    <div id="loading" class="text-center py-10 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-blue-500"></i><p>กำลังโหลดข้อมูล...</p>
    </div>

    <form id="bookingForm" class="hidden space-y-5">
      
      <div class="bg-white p-5 rounded-2xl shadow-sm">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-car text-blue-500"></i> 1. รถและสาขา</h2>
        <select id="vehicleSelect" class="w-full p-3 border rounded-xl bg-gray-50 text-sm mb-3" required></select>
        <select id="carSizeSelect" class="w-full p-3 border rounded-xl bg-gray-50 text-sm mb-3 font-bold text-blue-700" onchange="renderServices()" required>
          <option value="M">ขนาดรถ: M (รถเก๋งเล็ก/Eco Car)</option>
          <option value="L">ขนาดรถ: L (รถเก๋งใหญ่/SUV)</option>
          <option value="XL">ขนาดรถ: XL (กระบะ/ตู้/PPV)</option>
        </select>
        <select id="branchSelect" class="w-full p-3 border rounded-xl bg-gray-50 text-sm" onchange="branchChanged()" required></select>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-spray-can-sparkles text-blue-500"></i> 2. เลือกบริการ (เลือกได้หลายรายการ)</h2>
        <div class="flex bg-gray-100 p-1 rounded-xl mb-4 relative">
          <div id="lineBg" class="absolute w-1/2 h-[calc(100%-8px)] bg-white rounded-lg shadow-sm transition-all left-1 top-1"></div>
          <button type="button" id="btnLine1" onclick="selectLine('LINE1')" class="relative w-1/2 py-2 text-sm font-bold text-gray-800 z-10"><i class="fa-solid fa-robot"></i> ล้างด่วน (เครื่อง)</button>
          <button type="button" id="btnLine2" onclick="selectLine('LINE2')" class="relative w-1/2 py-2 text-sm font-bold text-gray-400 z-10"><i class="fa-solid fa-hands-bubbles"></i> ล้างปกติ (พนักงาน)</button>
        </div>
        <input type="hidden" id="selectedLineType" value="LINE1">
        <div id="servicesContainer" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-calendar-days text-blue-500"></i> 3. เลือกวันและเวลา</h2>
        
        <input type="text" id="datePicker" class="w-full p-4 border-2 border-blue-200 rounded-xl bg-blue-50 text-blue-700 font-bold text-center cursor-pointer shadow-sm placeholder-blue-400" placeholder="📅 แตะเพื่อเลือกวันและเวลา" readonly required>
        
        <input type="hidden" id="bookDate" required>
        <input type="hidden" id="selectedTime" required>

        <div id="selectedDateTimeDisplay" class="mt-4 text-center hidden transition-all">
          <div class="bg-green-100 text-green-700 px-4 py-3 rounded-xl font-bold border border-green-300 shadow-inner">
            <i class="fa-solid fa-circle-check text-xl mb-1 block"></i>
            คิวของคุณ: <span id="displayDT"></span>
          </div>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-truck-fast text-blue-500"></i> 4. บริการรับ-ส่งรถ</h2>
        <select id="deliverySelect" class="w-full p-3 border rounded-xl bg-gray-50 text-sm mb-4" onchange="toggleDelivery()">
          <option value="none">ขับมาเอง (ไม่ใช้บริการ)</option>
          <option value="pickup">ให้ร้านไปรับ (ปักหมุดจุดรับ)</option>
          <option value="dropoff">ให้ร้านไปส่ง (ปักหมุดจุดส่ง)</option>
          <option value="roundtrip_same">รับ-ส่ง ที่จุดเดียวกัน</option>
          <option value="roundtrip_diff">รับ-ส่ง คนละจุด</option>
        </select>
        
        <div id="mapContainer" class="hidden space-y-3">
          <div id="markerToggle" class="hidden flex gap-2 mb-2">
            <button type="button" id="btnPinPickup" onclick="setActivePin('pickup')" class="flex-1 py-2 rounded-lg text-sm font-bold bg-green-500 text-white border-2 border-green-600">📍 หมุดรับรถ</button>
            <button type="button" id="btnPinDropoff" onclick="setActivePin('dropoff')" class="flex-1 py-2 rounded-lg text-sm font-bold bg-gray-200 text-gray-600 border-2 border-transparent">📍 หมุดส่งรถ</button>
          </div>
          <div id="map" class="shadow-inner border border-gray-200"></div>
          <button type="button" onclick="getCurrentGPS()" class="w-full bg-blue-100 text-blue-700 py-2 rounded-xl text-sm font-bold shadow-sm">
            <i class="fa-solid fa-location-crosshairs"></i> ดึงพิกัดปัจจุบัน
          </button>
          <input type="hidden" id="pickupLat"><input type="hidden" id="pickupLng">
          <input type="hidden" id="dropoffLat"><input type="hidden" id="dropoffLng">
        </div>
      </div>

      <div class="bg-gray-800 p-5 rounded-2xl shadow-lg text-white">
        <h2 class="font-bold mb-3 border-b border-gray-600 pb-2"><i class="fa-solid fa-receipt"></i> สรุปรายการ</h2>
        <div id="summaryList" class="space-y-1 text-sm text-gray-300 mb-3"></div>
        <div class="flex justify-between text-sm text-gray-300 mb-3">
          <span>ค่าบริการรับ-ส่ง (ประเมิน)</span><span id="sumDelivery">0.-</span>
        </div>
        <div class="flex gap-2 mb-4">
          <input type="text" placeholder="โค้ดส่วนลด / แพ็กเกจ" class="w-2/3 p-2 rounded bg-gray-700 text-white text-sm border border-gray-600">
          <button type="button" class="w-1/3 bg-gray-600 rounded text-sm font-bold hover:bg-gray-500 transition">ใช้โค้ด</button>
        </div>
        <div class="flex justify-between items-end border-t border-gray-600 pt-3">
          <span class="text-sm">ยอดชำระโดยประมาณ</span><span id="sumTotal" class="text-2xl font-bold text-green-400">0.-</span>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition text-lg mb-10">
        ยืนยันการจองคิว
      </button>
    </form>
  </div>

  <script>
    // ⚠️ แก้ไข API_URL เป็นของ Google Apps Script ของคุณโอม
    const API_URL = "https://script.google.com/macros/s/AKfycbyTgEm-fiGqCe-aeYPjbizXPMbIKfxQM0_jQHwZK97j3-7eApuhP0S_f9zmlpsrJ5yF/exec";
    
    let masterData = {};
    let userUid = "U825fa531ed42d452068d034671e8c2e2"; 
    let map, markerPickup, markerDropoff;
    let activePin = 'pickup';

    async function init() {
      await loadInitialData();

      // สร้างปฏิทินแบบ Popup
      flatpickr("#datePicker", { 
        disableMobile: "true", // บังคับใช้ UI ของ flatpickr เอง
        locale: "th", 
        minDate: "today", 
        onChange: function(selectedDates, dateStr, instance) { 
          // เช็คก่อนว่าเลือกบริการหรือยัง
          const totalTime = parseInt(document.getElementById('bookingForm').dataset.totalTime) || 0;
          if(totalTime === 0) {
            Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาเลือกบริการในข้อ 2 ก่อนเลือกเวลาครับ' });
            instance.clear();
            return;
          }
          // ถ้าเลือกบริการแล้ว ให้เซฟวันที่และเปิด Popup โชว์เวลา
          document.getElementById('bookDate').value = dateStr; 
          openTimeSlotPopup(dateStr); 
        } 
      });
    }

    async function loadInitialData() {
      try {
        const res = await fetch(`${API_URL}?action=getInitialBookingData&lineUid=${userUid}`);
        const data = await res.json();
        masterData = data.data;

        document.getElementById('vehicleSelect').innerHTML = masterData.vehicles.length ? masterData.vehicles.map(v => `<option value="${v.id}">${v.plate} (${v.model})</option>`).join('') : `<option value="">โปรดเพิ่มรถยนต์ก่อน</option>`;
        document.getElementById('branchSelect').innerHTML = masterData.branches.map(b => `<option value="${b.branch_id}">${b.branch_name}</option>`).join('');

        selectLine('LINE1');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('bookingForm').classList.remove('hidden');
      } catch (e) { Swal.fire('Error', e.message, 'error'); }
    }

    function branchChanged() { renderServices(); }

    function selectLine(type) {
      document.getElementById('selectedLineType').value = type;
      const bg = document.getElementById('lineBg');
      if(type === 'LINE1') {
        bg.style.transform = 'translateX(0)';
        document.getElementById('btnLine1').classList.replace('text-gray-400', 'text-gray-800');
        document.getElementById('btnLine2').classList.replace('text-gray-800', 'text-gray-400');
      } else {
        bg.style.transform = 'translateX(100%)';
        document.getElementById('btnLine2').classList.replace('text-gray-400', 'text-gray-800');
        document.getElementById('btnLine1').classList.replace('text-gray-800', 'text-gray-400');
      }
      renderServices();
    }

    function renderServices() {
      const size = document.getElementById('carSizeSelect').value;
      const container = document.getElementById('servicesContainer');
      const grouped = masterData.services.reduce((acc, obj) => { const k = obj.category; if (!acc[k]) acc[k] = []; acc[k].push(obj); return acc; }, {});
      
      let html = '';
      for (const cat in grouped) {
        html += `<div class="font-bold text-xs text-gray-500 mb-2 mt-4 ml-1">${cat}</div>`;
        grouped[cat].forEach(s => {
          const price = size === 'M' ? s.price_m : (size === 'L' ? s.price_l : s.price_xl);
          html += `
          <label class="block relative cursor-pointer mb-2">
            <input type="checkbox" class="checkbox-custom hidden" value="${s.service_id}" data-name="${s.service_name}" data-price="${price}" data-time="${s.std_time_mins}" onchange="updateSummary()">
            <div class="border-2 border-gray-200 rounded-xl p-3 flex justify-between items-center transition bg-white shadow-sm">
              <div>
                <div class="font-bold text-gray-700 text-sm">${s.service_name}</div>
                <div class="text-xs text-gray-400"><i class="fa-regular fa-clock"></i> ${s.std_time_mins} นาที</div>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-blue-600">${price}.-</span>
                <i class="check-icon fa-solid fa-circle-check text-blue-500 text-xl hidden"></i>
              </div>
            </div>
          </label>`;
        });
      }
      container.innerHTML = html;
      updateSummary();
    }

    function updateSummary() {
      const checked = document.querySelectorAll('.checkbox-custom:checked');
      let totalSvcPrice = 0; let totalSvcTime = 0; let summaryHtml = '';

      checked.forEach(cb => {
        totalSvcPrice += parseInt(cb.dataset.price);
        totalSvcTime += parseInt(cb.dataset.time);
        summaryHtml += `<div class="flex justify-between"><span>- ${cb.dataset.name}</span><span>${cb.dataset.price}.-</span></div>`;
      });

      document.getElementById('summaryList').innerHTML = summaryHtml || '<span class="text-gray-500 italic">ยังไม่ได้เลือกบริการ</span>';
      const deliveryFee = calculateDeliveryFee();
      document.getElementById('sumDelivery').textContent = deliveryFee > 0 ? `${deliveryFee}.-` : '0.-';
      document.getElementById('sumTotal').textContent = `${totalSvcPrice + deliveryFee}.-`;
      
      document.getElementById('bookingForm').dataset.totalTime = totalSvcTime;
      
      // ล้างค่าเวลาเดิมถ้าเปลี่ยนบริการ
      document.getElementById('datePicker').value = '';
      document.getElementById('selectedTime').value = '';
      document.getElementById('selectedDateTimeDisplay').classList.add('hidden');
    }

    // ==========================================
    // ⏰ ระบบโชว์เวลาใน Popup (SweetAlert2)
    // ==========================================
    function formatTimeString(val) {
      if (!val) return '08:00';
      if (typeof val === 'string' && val.includes('T')) {
        const d = new Date(val);
        return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' });
      }
      return String(val).substring(0, 5);
    }

    function openTimeSlotPopup(dateStr) {
      const branchId = document.getElementById('branchSelect').value;
      const type = document.getElementById('selectedLineType').value;
      const totalTime = parseInt(document.getElementById('bookingForm').dataset.totalTime) || 0;
      const branch = masterData.branches.find(b => b.branch_id === branchId);
      
      const openT = formatTimeString(branch.open_time).split(':'); 
      const closeT = formatTimeString(branch.close_time).split(':');
      
      let currentMin = parseInt(openT[0]) * 60 + parseInt(openT[1]);
      const endMin = parseInt(closeT[0]) * 60 + parseInt(closeT[1]);
      
      let html = '<div class="swal-time-grid">';
      let hasSlots = false;

      while (currentMin < endMin) {
        const h = Math.floor(currentMin / 60).toString().padStart(2, '0');
        const m = (currentMin % 60).toString().padStart(2, '0');
        const timeStr = `${h}:${m}`;
        
        // ปุ่มเวลา
        html += `<button type="button" onclick="confirmTimeSlot('${timeStr}')" class="time-btn">${timeStr}</button>`;
        hasSlots = true;

        if (type === 'LINE1') currentMin += 10; 
        else currentMin += (totalTime + (parseInt(branch.buffer_time) || 10)); 
      }
      html += '</div>';

      if(!hasSlots) html = '<p class="text-gray-500 py-6">คิวเต็ม หรือไม่มีเวลาว่างในสาขานี้</p>';

      const displayDate = new Date(dateStr).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

      Swal.fire({
        title: `เลือกเวลาเข้ารับบริการ\n<span class="text-sm font-normal text-gray-500 mt-1 block">วันที่: ${displayDate}</span>`,
        html: html,
        showConfirmButton: false,
        showCloseButton: true,
        customClass: { popup: 'rounded-2xl' }
      });
    }

    // เมื่อลูกค้าจิ้มเลือกเวลาใน Popup
    function confirmTimeSlot(timeStr) {
      document.getElementById('selectedTime').value = timeStr;
      const dateStr = document.getElementById('bookDate').value;
      const displayDate = new Date(dateStr).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      
      // อัปเดต UI ให้ดูสวยงาม
      document.getElementById('datePicker').value = `${displayDate} เวลา ${timeStr} น.`;
      document.getElementById('selectedDateTimeDisplay').classList.remove('hidden');
      document.getElementById('displayDT').innerText = `${displayDate} | ${timeStr} น.`;
      
      Swal.close(); // ปิด Popup
    }

    // ==========================================
    // ระบบแผนที่คู่ (รับ-ส่ง)
    // ==========================================
    function toggleDelivery() {
      const val = document.getElementById('deliverySelect').value;
      const mapDiv = document.getElementById('mapContainer');
      const toggleBtns = document.getElementById('markerToggle');
      
      if (val === 'none') { mapDiv.classList.add('hidden'); updateSummary(); return; }
      mapDiv.classList.remove('hidden');
      toggleBtns.classList.toggle('hidden', val !== 'roundtrip_diff');
      if(!map) initMap();
      
      if(val === 'pickup') { activePin = 'pickup'; markerPickup.setOpacity(1); markerDropoff.setOpacity(0); setActivePin('pickup'); }
      else if(val === 'dropoff') { activePin = 'dropoff'; markerPickup.setOpacity(0); markerDropoff.setOpacity(1); setActivePin('dropoff'); }
      else if(val === 'roundtrip_same') { activePin = 'pickup'; markerPickup.setOpacity(1); markerDropoff.setOpacity(0); setActivePin('pickup'); }
      else { markerPickup.setOpacity(1); markerDropoff.setOpacity(1); setActivePin('pickup'); }
      updateSummary();
    }

    function setActivePin(type) {
      activePin = type;
      if(type === 'pickup') {
        document.getElementById('btnPinPickup').classList.replace('bg-gray-200','bg-green-500'); document.getElementById('btnPinPickup').classList.replace('text-gray-600','text-white'); document.getElementById('btnPinPickup').classList.replace('border-transparent','border-green-600');
        document.getElementById('btnPinDropoff').classList.replace('bg-red-500','bg-gray-200'); document.getElementById('btnPinDropoff').classList.replace('text-white','text-gray-600'); document.getElementById('btnPinDropoff').classList.replace('border-red-600','border-transparent');
      } else {
        document.getElementById('btnPinDropoff').classList.replace('bg-gray-200','bg-red-500'); document.getElementById('btnPinDropoff').classList.replace('text-gray-600','text-white'); document.getElementById('btnPinDropoff').classList.replace('border-transparent','border-red-600');
        document.getElementById('btnPinPickup').classList.replace('bg-green-500','bg-gray-200'); document.getElementById('btnPinPickup').classList.replace('text-white','text-gray-600'); document.getElementById('btnPinPickup').classList.replace('border-green-600','border-transparent');
      }
    }

    function initMap() {
      const branchId = document.getElementById('branchSelect').value;
      const branch = masterData.branches.find(b => b.branch_id === branchId);
      const bLat = parseFloat(branch?.lat) || 9.143; const bLng = parseFloat(branch?.lng) || 99.330;

      map = L.map('map').setView([bLat, bLng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      L.marker([bLat, bLng]).addTo(map).bindPopup("สาขาของร้าน").openPopup();

      const greenIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41] });
      const redIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41] });

      markerPickup = L.marker([bLat+0.005, bLng], {draggable: true, icon: greenIcon}).addTo(map);
      markerDropoff = L.marker([bLat-0.005, bLng], {draggable: true, icon: redIcon}).addTo(map);
      
      savePinLocation('pickup', markerPickup.getLatLng()); savePinLocation('dropoff', markerDropoff.getLatLng());
      markerPickup.on('dragend', (e) => savePinLocation('pickup', e.target.getLatLng()));
      markerDropoff.on('dragend', (e) => savePinLocation('dropoff', e.target.getLatLng()));

      map.on('click', (e) => {
        if(activePin === 'pickup') { markerPickup.setLatLng(e.latlng); savePinLocation('pickup', e.latlng); }
        else { markerDropoff.setLatLng(e.latlng); savePinLocation('dropoff', e.latlng); }
      });
    }

    function savePinLocation(type, latlng) { document.getElementById(`${type}Lat`).value = latlng.lat; document.getElementById(`${type}Lng`).value = latlng.lng; updateSummary(); }

    function getCurrentGPS() {
      if(navigator.geolocation) {
        Swal.fire({ title: 'หาพิกัด...', didOpen: () => Swal.showLoading() });
        navigator.geolocation.getCurrentPosition(pos => {
          const ll = [pos.coords.latitude, pos.coords.longitude]; map.flyTo(ll, 16);
          if(activePin==='pickup') { markerPickup.setLatLng(ll); savePinLocation('pickup', {lat:ll[0], lng:ll[1]}); }
          else { markerDropoff.setLatLng(ll); savePinLocation('dropoff', {lat:ll[0], lng:ll[1]}); }
          Swal.close();
        }, () => Swal.fire('แจ้งเตือน', 'กรุณาอนุญาตให้เข้าถึงตำแหน่ง GPS', 'error'));
      }
    }

    function calcCrow(lat1, lon1, lat2, lon2) {
      const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function calculateDeliveryFee() {
      const val = document.getElementById('deliverySelect').value;
      if (val === 'none') return 0;
      const branchId = document.getElementById('branchSelect').value;
      const branch = masterData.branches.find(b => b.branch_id === branchId);
      if(!branch) return 0;

      const freeKm = parseFloat(branch.free_km) || 0; const feeKm = parseFloat(branch.fee_per_km) || 0;
      const bLat = parseFloat(branch.lat); const bLng = parseFloat(branch.lng);

      let dist1 = 0, dist2 = 0;
      if(val === 'pickup' || val === 'roundtrip_same' || val === 'roundtrip_diff') dist1 = calcCrow(bLat, bLng, parseFloat(document.getElementById('pickupLat').value), parseFloat(document.getElementById('pickupLng').value));
      if(val === 'dropoff' || val === 'roundtrip_diff') dist2 = calcCrow(bLat, bLng, parseFloat(document.getElementById('dropoffLat').value), parseFloat(document.getElementById('dropoffLng').value));
      if(val === 'roundtrip_same') dist2 = dist1;

      const cost1 = Math.max(0, dist1 - freeKm) * feeKm; const cost2 = Math.max(0, dist2 - freeKm) * feeKm;
      return Math.round(cost1 + cost2);
    }

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const time = document.getElementById('selectedTime').value;
      const checkedSvcs = Array.from(document.querySelectorAll('.checkbox-custom:checked')).map(cb => cb.value).join(',');
      
      if(!checkedSvcs) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกบริการอย่างน้อย 1 รายการ', 'warning');
      if(!time) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกวันและเวลา', 'warning');

      const payload = {
        lineUid: userUid, vehicleId: document.getElementById('vehicleSelect').value, serviceType: checkedSvcs,
        bookingDate: document.getElementById('bookDate').value + 'T' + time, deliveryType: document.getElementById('deliverySelect').value,
        lat: document.getElementById('pickupLat').value, lng: document.getElementById('pickupLng').value, extraFee: calculateDeliveryFee()
      };

      Swal.fire({ title: 'กำลังจองคิว...', didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(`${API_URL}?action=submitBooking`, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if(result.status === 'success') Swal.fire('สำเร็จ!', 'จองคิวเรียบร้อย', 'success'); else throw new Error(result.message);
      } catch (err) { Swal.fire('Error', err.message, 'error'); }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
