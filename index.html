<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิวล้างรถ - Karshine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 pb-20 font-sans selection:bg-blue-200">
  <div class="bg-blue-600 text-white p-5 rounded-b-3xl shadow-md mb-6">
    <h1 class="text-2xl font-bold text-center">จองคิวเข้ารับบริการ</h1>
    <p class="text-center text-blue-100 text-sm mt-1">สะดวกรวดเร็ว ไม่ต้องรอคิวหน้าร้าน</p>
  </div>

  <div class="max-w-md mx-auto px-4" id="app-container">
    <div id="loading" class="text-center py-10 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i><p>กำลังเตรียมข้อมูล...</p>
    </div>

    <form id="bookingForm" class="hidden space-y-6">
      
      <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-car"></i> 1. เลือกรถของคุณ</h2>
        <select id="vehicleSelect" class="w-full p-3 border rounded-lg bg-gray-50 text-sm" required></select>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-location-dot"></i> 2. เลือกสาขา</h2>
        <select id="branchSelect" class="w-full p-3 border rounded-lg bg-gray-50 text-sm" onchange="generateTimeSlots()" required></select>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-spray-can-sparkles"></i> 3. รูปแบบการล้าง</h2>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <label class="border p-3 rounded-lg text-center cursor-pointer hover:bg-blue-50 transition" id="lbl-line1">
            <input type="radio" name="lineType" value="LINE1" class="hidden" onchange="toggleServiceLine()">
            <i class="fa-solid fa-robot text-2xl text-gray-400 mb-1 block"></i>
            <span class="text-sm font-bold text-gray-700">ล้างด่วน (เครื่อง)</span>
          </label>
          <label class="border p-3 rounded-lg text-center cursor-pointer hover:bg-blue-50 transition" id="lbl-line2">
            <input type="radio" name="lineType" value="LINE2" class="hidden" onchange="toggleServiceLine()" checked>
            <i class="fa-solid fa-hands-bubbles text-2xl text-gray-400 mb-1 block"></i>
            <span class="text-sm font-bold text-gray-700">ล้างปกติ (พนักงาน)</span>
          </label>
        </div>
        <select id="serviceSelect" class="w-full p-3 border rounded-lg bg-gray-50 text-sm" onchange="generateTimeSlots()" required></select>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-calendar-days"></i> 4. วันและเวลา</h2>
        <input type="date" id="bookDate" class="w-full p-3 border rounded-lg bg-gray-50 mb-3" onchange="generateTimeSlots()" required>
        <div id="timeSlots" class="grid grid-cols-3 gap-2 mt-3 max-h-48 overflow-y-auto p-1">
          <p class="col-span-3 text-center text-sm text-gray-400">กรุณาเลือกสาขาและบริการ</p>
        </div>
        <input type="hidden" id="selectedTime" required>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-truck-fast"></i> 5. บริการรับ-ส่งรถ (Valet)</h2>
        <select id="deliverySelect" class="w-full p-3 border rounded-lg bg-gray-50 text-sm mb-3" onchange="toggleDeliveryInputs()">
          <option value="none">ขับมาเอง (ไม่ใช้บริการรับ-ส่ง)</option>
          <option value="pickup">ให้ร้านไปรับ (ส่งเอง)</option>
          <option value="dropoff">ให้ร้านไปส่ง (ขับมาเอง)</option>
          <option value="roundtrip">รับ-ส่ง ทั้งสองขา</option>
        </select>
        
        <div id="deliveryInputs" class="hidden space-y-3 p-3 bg-blue-50 rounded-lg">
          <div id="pickupBox" class="hidden">
            <label class="text-xs font-bold text-blue-700">พิกัดจุดรับรถ (Google Maps Link)</label>
            <input type="text" id="pickupLink" class="w-full p-2 border rounded text-sm mt-1" placeholder="วางลิงก์พิกัดจุดรับ">
          </div>
          <div id="dropoffBox" class="hidden">
            <label class="text-xs font-bold text-blue-700">พิกัดจุดส่งรถ (Google Maps Link)</label>
            <input type="text" id="dropoffLink" class="w-full p-2 border rounded text-sm mt-1" placeholder="วางลิงก์พิกัดจุดส่ง">
          </div>
          <p class="text-[10px] text-gray-500 italic">*ระบบจะคำนวณค่าส่งจากระยะทางจริงหลังจากท่านส่งลิงก์พิกัดเรียบร้อยแล้ว</p>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition text-lg">
        ยืนยันการจองคิว
      </button>
    </form>
  </div>

  <script>
    // ⚠️ แก้ไข API_URL เป็นของ Google Apps Script ของคุณโอม
    const API_URL = "https://script.google.com/macros/s/AKfycbyTgEm-fiGqCe-aeYPjbizXPMbIKfxQM0_jQHwZK97j3-7eApuhP0S_f9zmlpsrJ5yF/exec";
    const LIFF_ID = "ใส่_LIFF_ID_ของคุณโอม_ที่นี่"; 
    
    let masterData = {};
    let userUid = "U825fa531ed42d452068d034671e8c2e2"; // Mock UID สำหรับทดสอบในคอม

    // เริ่มต้นระบบ
    async function init() {
      // (ละ Liff Init ไว้เพื่อให้รันทดสอบในคอมได้ก่อน)
      document.getElementById('bookDate').min = new Date().toISOString().split('T')[0];
      await loadInitialData();
    }

    async function loadInitialData() {
      try {
        const res = await fetch(`${API_URL}?action=getInitialBookingData&lineUid=${userUid}`);
        const data = await res.json();
        masterData = data.data;

        // ดึงรถยนต์
        const vSel = document.getElementById('vehicleSelect');
        vSel.innerHTML = masterData.vehicles.length ? 
          masterData.vehicles.map(v => `<option value="${v.id}">${v.plate} (${v.model})</option>`).join('') :
          `<option value="">ยังไม่มีข้อมูลรถ (โปรดเพิ่มรถก่อน)</option>`;

        // ดึงสาขา
        const bSel = document.getElementById('branchSelect');
        bSel.innerHTML = masterData.branches.map(b => `<option value="${b.branch_id}">${b.branch_name}</option>`).join('');

        toggleServiceLine(); // โหลดบริการครั้งแรก
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('bookingForm').classList.remove('hidden');
      } catch (e) {
        Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้: ' + e.message, 'error');
      }
    }

    // สลับ Line 1 / Line 2
    function toggleServiceLine() {
      const type = document.querySelector('input[name="lineType"]:checked').value;
      
      // เปลี่ยนสีปุ่มที่เลือก
      document.getElementById('lbl-line1').classList.replace(type==='LINE1'?'border-gray-200':'border-blue-500', type==='LINE1'?'border-blue-500':'border-gray-200');
      document.getElementById('lbl-line2').classList.replace(type==='LINE2'?'border-gray-200':'border-blue-500', type==='LINE2'?'border-blue-500':'border-gray-200');

      // กรองบริการ (ตัวอย่าง: สมมติว่า Line 1 คือล้างด่วน, Line 2 คือทั้งหมด)
      // *สามารถปรับลอจิกกรองหมวดหมู่ที่นี่ได้ครับ
      const sSel = document.getElementById('serviceSelect');
      let filteredSvc = masterData.services;
      
      sSel.innerHTML = filteredSvc.map(s => `<option value="${s.service_id}" data-time="${s.std_time_mins}">${s.service_name} (${s.std_time_mins} นาที)</option>`).join('');
      generateTimeSlots();
    }

    // 🕒 ลอจิกการสร้าง Slot เวลาอัจฉริยะ (Dynamic Slots)
    function generateTimeSlots() {
      const branchId = document.getElementById('branchSelect').value;
      const svcSelect = document.getElementById('serviceSelect');
      const bookDate = document.getElementById('bookDate').value;
      const type = document.querySelector('input[name="lineType"]:checked').value;
      const slotContainer = document.getElementById('timeSlots');
      
      if(!branchId || !svcSelect.value || !bookDate) return;

      const branch = masterData.branches.find(b => b.branch_id === branchId);
      const svcTime = parseInt(svcSelect.options[svcSelect.selectedIndex].dataset.time) || 30;
      
      // ดึงเวลาเปิด-ปิดสาขา
      const openT = branch.open_time.split(':');
      const closeT = branch.close_time.split(':');
      let currentMin = parseInt(openT[0]) * 60 + parseInt(openT[1]);
      const endMin = parseInt(closeT[0]) * 60 + parseInt(closeT[1]);
      
      let html = '';
      
      while (currentMin < endMin) {
        const h = Math.floor(currentMin / 60).toString().padStart(2, '0');
        const m = (currentMin % 60).toString().padStart(2, '0');
        const timeStr = `${h}:${m}`;
        
        html += `<div onclick="selectSlot(this, '${timeStr}')" class="time-slot border border-blue-200 text-blue-600 text-center py-2 rounded-lg cursor-pointer hover:bg-blue-100 transition text-sm font-bold">${timeStr}</div>`;
        
        // ถ้าเป็น Line 1 = ตัดทีละ 10 นาทีตายตัว
        if (type === 'LINE1') { currentMin += 10; } 
        // ถ้าเป็น Line 2 = เวลาบริการ + เวลาพัก (Buffer)
        else { currentMin += (svcTime + (parseInt(branch.buffer_time) || 10)); }
      }
      
      slotContainer.innerHTML = html;
      document.getElementById('selectedTime').value = '';
    }

    // เลือกเวลา
    function selectSlot(el, timeStr) {
      document.querySelectorAll('.time-slot').forEach(div => {
        div.classList.remove('bg-blue-600', 'text-white');
        div.classList.add('text-blue-600');
      });
      el.classList.remove('text-blue-600');
      el.classList.add('bg-blue-600', 'text-white');
      document.getElementById('selectedTime').value = timeStr;
    }

    // เปิดปิดกล่องรับส่ง
    function toggleDeliveryInputs() {
      const val = document.getElementById('deliverySelect').value;
      const container = document.getElementById('deliveryInputs');
      const pk = document.getElementById('pickupBox');
      const dp = document.getElementById('dropoffBox');
      
      if (val === 'none') { container.classList.add('hidden'); } 
      else {
        container.classList.remove('hidden');
        pk.classList.toggle('hidden', val === 'dropoff');
        dp.classList.toggle('hidden', val === 'pickup');
      }
    }

    // ส่งข้อมูลจองคิว
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const time = document.getElementById('selectedTime').value;
      if(!time) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกเวลาที่ต้องการจอง', 'warning');

      Swal.fire({ title: 'กำลังจองคิว...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      // จำลองการส่งข้อมูล (ส่วนคำนวณราคาค่าส่ง จะทำในฝั่ง Backend รอบถัดไป)
      const payload = {
        lineUid: userUid,
        vehicleId: document.getElementById('vehicleSelect').value,
        serviceType: document.getElementById('serviceSelect').value,
        bookingDate: document.getElementById('bookDate').value + 'T' + time,
        deliveryType: document.getElementById('deliverySelect').value
      };

      try {
        const res = await fetch(`${API_URL}?action=submitBooking`, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if(result.status === 'success') {
          Swal.fire('สำเร็จ!', 'จองคิวเรียบร้อยแล้ว แอดมินจะตรวจสอบและยืนยันในเร็วๆ นี้', 'success').then(()=>liff.closeWindow());
        } else throw new Error(result.message);
      } catch (err) { Swal.fire('เกิดข้อผิดพลาด', err.message, 'error'); }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
