<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิวรับบริการ - Karshine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ซ่อน Input แบบเก่า และตกแต่งปฏิทิน */
    .flatpickr-calendar { margin: 0 auto; box-shadow: none !important; border: 1px solid #e5e7eb; border-radius: 12px; }
    #map { height: 250px; width: 100%; border-radius: 12px; z-index: 1; }
  </style>
</head>
<body class="bg-blue-50 pb-20 font-sans">
  <div class="bg-blue-600 text-white p-6 rounded-b-[2.5rem] shadow-lg mb-6 relative overflow-hidden">
    <div class="relative z-10">
      <h1 class="text-2xl font-bold text-center">จองคิวเข้ารับบริการ</h1>
      <p class="text-center text-blue-100 text-sm mt-1">สะดวกรวดเร็ว ไม่ต้องรอคิวหน้าร้าน</p>
    </div>
  </div>

  <div class="max-w-md mx-auto px-4" id="app-container">
    <div id="loading" class="text-center py-10 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-blue-500"></i><p>กำลังเตรียมข้อมูล...</p>
    </div>

    <form id="bookingForm" class="hidden space-y-5">
      
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-car text-blue-500"></i> รถและสาขา</h2>
        <select id="vehicleSelect" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm mb-3" required></select>
        <select id="branchSelect" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm" onchange="generateTimeSlots()" required></select>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-spray-can-sparkles text-blue-500"></i> รูปแบบการล้าง</h2>
        
        <div class="flex bg-gray-100 p-1 rounded-xl mb-4 relative">
          <div id="lineBg" class="absolute w-1/2 h-[calc(100%-8px)] bg-white rounded-lg shadow-sm transition-all duration-300 left-1 top-1"></div>
          
          <button type="button" id="btnLine1" onclick="selectLine('LINE1')" class="relative w-1/2 py-2 text-sm font-bold text-gray-800 z-10 transition">
            <i class="fa-solid fa-robot"></i> ล้างด่วน (เครื่อง)
          </button>
          <button type="button" id="btnLine2" onclick="selectLine('LINE2')" class="relative w-1/2 py-2 text-sm font-bold text-gray-400 z-10 transition">
            <i class="fa-solid fa-hands-bubbles"></i> ล้างปกติ (พนักงาน)
          </button>
        </div>
        <input type="hidden" id="selectedLineType" value="LINE1">

        <select id="serviceSelect" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm" onchange="generateTimeSlots()" required></select>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-calendar-days text-blue-500"></i> เลือกวันและเวลา</h2>
        <div class="mb-4 flex justify-center">
          <input type="text" id="inlineCalendar" class="hidden">
        </div>
        
        <input type="hidden" id="bookDate" required>
        
        <div id="timeSlots" class="grid grid-cols-3 gap-2 mt-2 max-h-56 overflow-y-auto pr-1">
          <p class="col-span-3 text-center text-sm text-gray-400 py-4 bg-gray-50 rounded-lg">กรุณาเลือกวันที่จากปฏิทินด้านบน</p>
        </div>
        <input type="hidden" id="selectedTime" required>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-map-location-dot text-blue-500"></i> บริการรับ-ส่งรถ (Valet)</h2>
        <select id="deliverySelect" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm mb-4" onchange="toggleDelivery()">
          <option value="none">ขับมาเอง (ไม่ใช้บริการรับ-ส่ง)</option>
          <option value="pickup">ให้ร้านไปรับ (พิกัดจุดรับรถ)</option>
          <option value="dropoff">ให้ร้านไปส่ง (พิกัดจุดส่งรถ)</option>
          <option value="roundtrip">รับ-ส่ง ตามพิกัดที่ระบุ</option>
        </select>
        
        <div id="mapContainer" class="hidden space-y-3">
          <button type="button" onclick="getCurrentGPS()" class="w-full bg-blue-100 text-blue-700 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-blue-200">
            <i class="fa-solid fa-location-crosshairs"></i> ใช้พิกัดปัจจุบันของฉัน
          </button>
          
          <div id="map" class="shadow-inner"></div>
          <p class="text-xs text-gray-500 text-center"><i class="fa-solid fa-hand-pointer"></i> เลื่อนแผนที่เพื่อปรับจุดปักหมุด</p>
          
          <div class="flex gap-2">
            <input type="text" id="mapLat" class="w-1/2 p-2 bg-gray-100 rounded text-xs text-center border" readonly placeholder="Latitude">
            <input type="text" id="mapLng" class="w-1/2 p-2 bg-gray-100 rounded text-xs text-center border" readonly placeholder="Longitude">
          </div>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition text-lg mt-4">
        ยืนยันการจองคิว
      </button>
    </form>
  </div>

  <script>
    // ⚠️ แก้ไข API_URL เป็นของ Google Apps Script ของคุณโอม
    const API_URL = "https://script.google.com/macros/s/AKfycbyTgEm-fiGqCe-aeYPjbizXPMbIKfxQM0_jQHwZK97j3-7eApuhP0S_f9zmlpsrJ5yF/exec";
    const LIFF_ID = "ใส่_LIFF_ID_ที่นี่"; 
    
    let masterData = {};
    let userUid = "U825fa531ed42d452068d034671e8c2e2"; // Mock UID
    let map, marker; // ตัวแปรแผนที่

    async function init() {
      // โหลดข้อมูลก่อน
      await loadInitialData();
      
      // สร้างปฏิทินแบบฝังตัว (Inline)
      flatpickr("#inlineCalendar", {
        inline: true,
        locale: "th",
        minDate: "today",
        onChange: function(selectedDates, dateStr, instance) {
          document.getElementById('bookDate').value = dateStr;
          generateTimeSlots(); // สั่งให้สร้างปุ่มเวลาทันทีเมื่อกดเลือกวัน
        }
      });
      // เลือกวันปัจจุบันเป็นค่าเริ่มต้น
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('bookDate').value = today;
    }

    async function loadInitialData() {
      try {
        const res = await fetch(`${API_URL}?action=getInitialBookingData&lineUid=${userUid}`);
        const data = await res.json();
        masterData = data.data;

        document.getElementById('vehicleSelect').innerHTML = masterData.vehicles.length ? 
          masterData.vehicles.map(v => `<option value="${v.id}">${v.plate} (${v.model})</option>`).join('') :
          `<option value="">โปรดเพิ่มรถยนต์ก่อน</option>`;

        document.getElementById('branchSelect').innerHTML = masterData.branches.map(b => `<option value="${b.branch_id}">${b.branch_name}</option>`).join('');

        // เลือก Line 1 เป็นค่าเริ่มต้นและดึงบริการ
        selectLine('LINE1');
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('bookingForm').classList.remove('hidden');
      } catch (e) {
        Swal.fire('Error', e.message, 'error');
      }
    }

    // ==========================================
    // ระบบสลับ Line 1 และ Line 2 สวยๆ
    // ==========================================
    function selectLine(type) {
      document.getElementById('selectedLineType').value = type;
      const bg = document.getElementById('lineBg');
      const btn1 = document.getElementById('btnLine1');
      const btn2 = document.getElementById('btnLine2');

      if(type === 'LINE1') {
        bg.style.transform = 'translateX(0)';
        btn1.classList.replace('text-gray-400', 'text-gray-800');
        btn2.classList.replace('text-gray-800', 'text-gray-400');
      } else {
        bg.style.transform = 'translateX(100%)';
        btn2.classList.replace('text-gray-400', 'text-gray-800');
        btn1.classList.replace('text-gray-800', 'text-gray-400');
      }

      // นำบริการมาใส่ Dropdown
      const sSel = document.getElementById('serviceSelect');
      sSel.innerHTML = masterData.services.map(s => `<option value="${s.service_id}" data-time="${s.std_time_mins}">${s.service_name} (${s.std_time_mins} นาที)</option>`).join('');
      
      generateTimeSlots();
    }

    // ==========================================
    // ระบบสร้างปุ่มเวลา (คำนวณตามเครื่อง/คน)
    // ==========================================
    function generateTimeSlots() {
      const branchId = document.getElementById('branchSelect').value;
      const svcSelect = document.getElementById('serviceSelect');
      const bookDate = document.getElementById('bookDate').value;
      const type = document.getElementById('selectedLineType').value;
      const slotContainer = document.getElementById('timeSlots');
      
      if(!branchId || !svcSelect.value || !bookDate) return;

      const branch = masterData.branches.find(b => b.branch_id === branchId);
      const svcTime = parseInt(svcSelect.options[svcSelect.selectedIndex].dataset.time) || 30;
      
      const openT = branch.open_time.split(':');
      const closeT = branch.close_time.split(':');
      let currentMin = parseInt(openT[0]) * 60 + parseInt(openT[1]);
      const endMin = parseInt(closeT[0]) * 60 + parseInt(closeT[1]);
      
      let html = '';
      
      while (currentMin < endMin) {
        const h = Math.floor(currentMin / 60).toString().padStart(2, '0');
        const m = (currentMin % 60).toString().padStart(2, '0');
        const timeStr = `${h}:${m}`;
        
        html += `<div onclick="selectSlot(this, '${timeStr}')" class="time-slot border border-blue-200 text-blue-600 bg-white text-center py-2 rounded-lg cursor-pointer hover:bg-blue-100 transition text-sm font-bold shadow-sm">${timeStr}</div>`;
        
        // ถ้า Line 1 (เครื่อง) = ช่องละ 10 นาที
        if (type === 'LINE1') currentMin += 10; 
        // ถ้า Line 2 (คน) = เวลาบริการ + Buffer ของสาขานั้น
        else currentMin += (svcTime + (parseInt(branch.buffer_time) || 10)); 
      }
      
      slotContainer.innerHTML = html || '<p class="col-span-3 text-center text-sm text-gray-400 py-4">ไม่มีเวลาว่างในสาขานี้</p>';
      document.getElementById('selectedTime').value = '';
    }

    function selectSlot(el, timeStr) {
      document.querySelectorAll('.time-slot').forEach(div => {
        div.classList.remove('bg-blue-600', 'text-white', 'ring-2', 'ring-blue-300');
        div.classList.add('text-blue-600', 'bg-white');
      });
      el.classList.remove('text-blue-600', 'bg-white');
      el.classList.add('bg-blue-600', 'text-white', 'ring-2', 'ring-blue-300');
      document.getElementById('selectedTime').value = timeStr;
    }

    // ==========================================
    // ระบบแผนที่ (Leaflet)
    // ==========================================
    function toggleDelivery() {
      const val = document.getElementById('deliverySelect').value;
      const container = document.getElementById('mapContainer');
      if (val === 'none') {
        container.classList.add('hidden');
      } else {
        container.classList.remove('hidden');
        if(!map) initMap(); // สร้างแผนที่ครั้งแรกถ้ายังไม่มี
      }
    }

    function initMap() {
      // พิกัดเริ่มต้น (สมมติเป็นเซ็นทรัลสุราษฎร์ฯ หรือตั้งค่าเป็นสาขาก็ได้)
      const defaultLat = 9.123; 
      const defaultLng = 99.123;
      
      map = L.map('map').setView([defaultLat, defaultLng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      
      // สร้างหมุดที่ลากได้
      marker = L.marker([defaultLat, defaultLng], {draggable: true}).addTo(map);
      updateLocationFields(defaultLat, defaultLng);

      // อัปเดตช่องพิกัดเมื่อลากหมุดเสร็จ
      marker.on('dragend', function(e) {
        const position = marker.getLatLng();
        updateLocationFields(position.lat, position.lng);
      });
      
      // ขยับหมุดเมื่อจิ้มบนแผนที่
      map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        updateLocationFields(e.latlng.lat, e.latlng.lng);
      });
    }

    function updateLocationFields(lat, lng) {
      document.getElementById('mapLat').value = lat.toFixed(6);
      document.getElementById('mapLng').value = lng.toFixed(6);
    }

    function getCurrentGPS() {
      if (navigator.geolocation) {
        Swal.fire({ title: 'กำลังดึงพิกัด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.flyTo([lat, lng], 16);
            marker.setLatLng([lat, lng]);
            updateLocationFields(lat, lng);
            Swal.close();
          },
          () => { Swal.fire('Error', 'ไม่สามารถดึงพิกัดได้ โปรดอนุญาต GPS', 'error'); }
        );
      } else {
        Swal.fire('Error', 'อุปกรณ์ไม่รองรับ GPS', 'error');
      }
    }

    // ==========================================
    // Submit
    // ==========================================
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const time = document.getElementById('selectedTime').value;
      if(!time) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกเวลาจากปฏิทิน', 'warning');

      const payload = {
        lineUid: userUid,
        vehicleId: document.getElementById('vehicleSelect').value,
        serviceType: document.getElementById('serviceSelect').value,
        bookingDate: document.getElementById('bookDate').value + 'T' + time,
        deliveryType: document.getElementById('deliverySelect').value,
        lat: document.getElementById('mapLat').value || '',
        lng: document.getElementById('mapLng').value || ''
      };

      Swal.fire({ title: 'กำลังจองคิว...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(`${API_URL}?action=submitBooking`, { method: 'POST', body: JSON.stringify(payload) });
        const result = await res.json();
        if(result.status === 'success') Swal.fire('สำเร็จ!', 'จองคิวเรียบร้อย', 'success');
        else throw new Error(result.message);
      } catch (err) { Swal.fire('Error', err.message, 'error'); }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
