<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการข้อมูลรถ - Karshine URT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 p-4">

  <div class="max-w-md mx-auto">
    <div id="debugStatus" class="text-sm text-center font-bold text-blue-800 mb-4 p-2 bg-blue-100 rounded-lg">
      สถานะ: กำลังเชื่อมต่อระบบ...
    </div>

    <div id="profileBox" class="hidden flex items-center mb-6 p-3 bg-blue-50 rounded-lg shadow-sm border border-blue-100">
      <img id="profileImage" src="" class="w-12 h-12 rounded-full mr-4 border-2 border-white shadow-sm">
      <div>
        <p class="text-xs text-gray-500 mb-0.5">ผู้ใช้งานระบบ</p>
        <p id="displayName" class="font-bold text-gray-800 text-sm"></p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">🚗 รถยนต์ของฉัน</h2>
      <div id="loading" class="text-center text-gray-500 py-4">กำลังโหลดข้อมูลรถ...</div>
      <div id="vehicleList" class="space-y-3 hidden"></div>
      <div id="emptyState" class="text-center text-gray-400 py-4 hidden">ยังไม่มีข้อมูลรถยนต์ในระบบ</div>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">➕ เพิ่มรถคันใหม่</h2>
      <form id="vehicleForm">
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">ทะเบียนรถ (ระบุจังหวัด)</label>
          <input type="text" id="licensePlate" required placeholder="เช่น กข 1234 สุราษฎร์ธานี" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">ยี่ห้อและรุ่น</label>
          <input type="text" id="brandModel" required placeholder="เช่น Avatr 11, Mercedes SLK 200" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 text-sm font-bold mb-2">สีรถ</label>
          <input type="text" id="color" required placeholder="เช่น สีขาว, สีเทาด้าน" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
        </div>
        <button type="button" id="submitBtn" disabled class="w-full bg-gray-400 text-white font-bold py-3 px-4 rounded-lg cursor-not-allowed transition duration-300 shadow-sm">
          รอระบบเชื่อมต่อ LINE...
        </button>
      </form>
    </div>
  </div>

  <script>
    // ⚠️⚠️ แก้ไข 2 บรรทัดนี้ให้เป็นข้อมูลของคุณ ⚠️⚠️
    const API_URL = "ใส่_URL_WEB_APP_ของคุณที่ก๊อปไว้ในสเตปที่_1"; 
    const LIFF_ID = "2009981892-wLKP1wYT"; // ใส่ LIFF ID หน้าจัดการรถ

    let lineUid = '';
    const debugText = document.getElementById('debugStatus');
    const submitBtn = document.getElementById('submitBtn');

    async function main() {
      try {
        debugText.textContent = "สถานะ: กำลังเชื่อมต่อ LIFF...";
        await liff.init({ liffId: LIFF_ID });
        
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineUid = profile.userId;
          debugText.style.display = 'none'; 
          
          submitBtn.disabled = false;
          submitBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
          submitBtn.classList.add('bg-green-600', 'hover:bg-green-700');
          submitBtn.innerHTML = 'บันทึกข้อมูลรถ';
          submitBtn.onclick = handleVehicleSubmit; 
          
          document.getElementById('profileBox').classList.remove('hidden');
          document.getElementById('profileImage').src = profile.pictureUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
          document.getElementById('displayName').textContent = profile.displayName;

          loadVehicles(); // โหลดข้อมูลผ่าน API ใหม่
        } else {
          liff.login();
        }
      } catch (err) {
        debugText.textContent = "สถานะ: ติดปัญหา (" + err.message + ")";
      }
    }

    document.addEventListener("DOMContentLoaded", main);

    // ฟังก์ชันยิง API ดึงข้อมูลจาก Google Apps Script
    async function loadVehicles() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('vehicleList').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'getUserVehicles', lineUid: lineUid })
        });
        
        const resData = await response.json();
        document.getElementById('loading').classList.add('hidden');

        if(resData.status === 'success' && resData.data.length > 0) {
          const listContainer = document.getElementById('vehicleList');
          listContainer.innerHTML = '';
          resData.data.forEach(v => {
            const item = document.createElement('div');
            item.className = 'p-3 border border-gray-200 rounded-lg flex justify-between items-center bg-gray-50';
            item.innerHTML = `<div><p class="font-bold text-gray-800">${v.plate}</p><p class="text-sm text-gray-600">${v.model} (${v.color})</p></div>`;
            listContainer.appendChild(item);
          });
          listContainer.classList.remove('hidden');
        } else {
          document.getElementById('emptyState').classList.remove('hidden');
        }
      } catch(e) {
        document.getElementById('loading').innerHTML = 'เกิดข้อผิดพลาดในการดึงข้อมูลรถ';
      }
    }

    // ฟังก์ชันยิง API ส่งข้อมูลเพิ่มรถไปยัง Google Apps Script
    async function handleVehicleSubmit(e) {
      e.preventDefault();
      const plate = document.getElementById('licensePlate').value;
      const model = document.getElementById('brandModel').value;
      const color = document.getElementById('color').value;
      
      if(!plate || !model || !color) {
        Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return;
      }

      submitBtn.innerHTML = 'กำลังบันทึก...';
      submitBtn.disabled = true;
      submitBtn.classList.replace('bg-green-600', 'bg-gray-400');

      const payload = { lineUid: lineUid, licensePlate: plate, brandModel: model, color: color };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'addVehicle', data: payload })
        });
        
        const resData = await response.json();

        if(resData.status === 'success') {
          Swal.fire({ title: 'สำเร็จ!', text: 'เพิ่มข้อมูลรถเรียบร้อยแล้ว', icon: 'success', timer: 1500, showConfirmButton: false }).then(() => {
            document.getElementById('licensePlate').value = '';
            document.getElementById('brandModel').value = '';
            document.getElementById('color').value = '';
            loadVehicles();
            submitBtn.innerHTML = 'บันทึกข้อมูลรถ';
            submitBtn.disabled = false;
            submitBtn.classList.replace('bg-gray-400', 'bg-green-600');
          });
        } else {
          Swal.fire('เกิดข้อผิดพลาด', resData.message, 'error');
          submitBtn.innerHTML = 'บันทึกข้อมูลรถ';
          submitBtn.disabled = false;
          submitBtn.classList.replace('bg-gray-400', 'bg-green-600');
        }
      } catch(e) {
        Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
        submitBtn.innerHTML = 'บันทึกข้อมูลรถ';
        submitBtn.disabled = false;
        submitBtn.classList.replace('bg-gray-400', 'bg-green-600');
      }
    }
  </script>
</body>
</html>
