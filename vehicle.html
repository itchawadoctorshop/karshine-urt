<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการข้อมูลรถ - Karshine URT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 pb-20 font-sans">
  
  <div id="liffStatus" class="bg-blue-100 text-blue-700 text-center py-2 text-sm font-bold shadow-sm">
    <i class="fa-solid fa-spinner fa-spin"></i> สถานะ: กำลังเชื่อมต่อ LIFF...
  </div>

  <div class="max-w-md mx-auto p-4">
    <div class="bg-white rounded-2xl shadow-sm p-4 mb-5 flex items-center gap-4 border border-gray-100">
      <img id="profileImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-14 h-14 rounded-full border-2 border-gray-200 object-cover shadow-sm">
      <div>
        <p class="text-xs text-gray-500 mb-0.5">ผู้ใช้งานระบบ</p>
        <p id="profileName" class="font-bold text-gray-800 text-lg">กำลังโหลด...</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-5 mb-5 border-t-4 border-red-500">
      <h2 class="font-bold text-gray-800 mb-3 border-b border-gray-100 pb-3">
        <i class="fa-solid fa-car text-red-500 mr-1"></i> รถยนต์ของฉัน
      </h2>
      <div id="vehicleList" class="space-y-3 text-sm text-gray-600">
        <div class="text-center py-4 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i><br>กำลังโหลดข้อมูลรถ...</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-5 border-t-4 border-gray-500">
      <h2 class="font-bold text-gray-800 mb-4">
        <i class="fa-solid fa-plus text-gray-500 mr-1"></i> เพิ่มรถคันใหม่
      </h2>
      <form id="addVehicleForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">ทะเบียนรถ (ระบุจังหวัด)</label>
          <input type="text" id="vPlate" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-gray-400 transition" placeholder="เช่น กข 1234 สุราษฎร์ธานี" required>
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">ยี่ห้อและรุ่น</label>
          <input type="text" id="vModel" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-gray-400 transition" placeholder="เช่น Avatr 11, Mercedes SLK 200" required>
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">สีรถ</label>
          <input type="text" id="vColor" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-gray-400 transition" placeholder="เช่น สีขาว, สีเทาด้าน" required>
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-gray-400 text-white font-bold py-4 rounded-xl shadow transition mt-2" disabled>
          รอระบบเชื่อมต่อ LINE...
        </button>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ แก้ไข API_URL เป็นของ Google Apps Script ของคุณโอม
    const API_URL = "https://script.google.com/macros/s/AKfycbyTgEm-fiGqCe-aeYPjbizXPMbIKfxQM0_jQHwZK97j3-7eApuhP0S_f9zmlpsrJ5yF/exec";
    
    // ⚠️ แก้ไข LIFF_ID สำหรับหน้าจัดการรถ
    const LIFF_ID = "2009981892-wLKP1wYT"; 
    
    let userUid = "U825fa531ed42d452068d034671e8c2e2"; // Mock UID สำหรับโหมดทดสอบ
    
    // ==========================================
    // 1. ระบบดึงข้อมูล LINE อัจฉริยะ (กันค้าง)
    // ==========================================
    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        userUid = profile.userId;
        document.getElementById('profileImg').src = profile.pictureUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
        document.getElementById('profileName').textContent = profile.displayName;
        
        // ซ่อนแถบสถานะเมื่อโหลดสำเร็จ
        document.getElementById('liffStatus').style.display = 'none';
        
        enableForm();
        loadVehicles();
      } catch(e) {
        console.error('LIFF Error:', e);
        // กรณีเปิดในคอมหรือ LIFF พัง จะสลับเป็นโหมดทดสอบทันที
        const statusBar = document.getElementById('liffStatus');
        statusBar.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ใช้งานโหมดทดสอบ (นอกแอป LINE)';
        statusBar.classList.replace('bg-blue-100', 'bg-yellow-100');
        statusBar.classList.replace('text-blue-700', 'text-yellow-700');
        document.getElementById('profileName').textContent = "โหมดทดสอบระบบ";
        
        enableForm();
        loadVehicles();
      }
    }

    function enableForm() {
      const btn = document.getElementById('btnSubmit');
      btn.disabled = false;
      btn.textContent = "บันทึกข้อมูลรถ";
      btn.classList.replace('bg-gray-400', 'bg-green-700');
      btn.classList.add('hover:bg-green-800', 'active:scale-95');
    }

    // ==========================================
    // 2. โหลดรายการรถยนต์ของลูกค้า
    // ==========================================
    async function loadVehicles() {
      try {
        const res = await fetch(`${API_URL}?action=getUserVehicles&lineUid=${userUid}`);
        const data = await res.json();
        const vList = document.getElementById('vehicleList');
        
        if(data.status === 'success' && data.data.length > 0) {
          vList.innerHTML = data.data.map(v => `
            <div class="p-3 bg-gray-50 border border-gray-200 rounded-xl shadow-sm flex items-center gap-3 relative">
              <div class="bg-red-100 p-2 rounded-lg text-red-600"><i class="fa-solid fa-car-side"></i></div>
              <div>
                <b class="text-gray-800">${v.plate}</b><br>
                <span class="text-xs text-gray-500">${v.model} • ${v.color}</span>
              </div>
            </div>
          `).join('');
        } else {
          vList.innerHTML = '<p class="text-center text-gray-400 py-2">ยังไม่มีข้อมูลรถยนต์</p>';
        }
      } catch(e) {
        document.getElementById('vehicleList').innerHTML = '<span class="text-red-500 text-sm"><i class="fa-solid fa-circle-xmark"></i> โหลดข้อมูลล้มเหลว โปรดลองใหม่</span>';
      }
    }

    // ==========================================
    // 3. บันทึกรถยนต์ (ใช้ระบบ POST แบบใหม่)
    // ==========================================
    document.getElementById('addVehicleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        action: 'addVehicle', // แนบ Action เข้าไปใน Payload ให้หลังบ้านรู้จัก
        lineUid: userUid,
        licensePlate: document.getElementById('vPlate').value,
        brandModel: document.getElementById('vModel').value,
        color: document.getElementById('vColor').value
      };
      
      Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(API_URL, { 
          method: 'POST', 
          body: JSON.stringify(payload) 
        });
        const result = await res.json();
        
        if(result.status === 'success') {
          Swal.fire('สำเร็จ', 'บันทึกข้อมูลรถยนต์เรียบร้อย', 'success');
          document.getElementById('addVehicleForm').reset();
          loadVehicles(); // รีเฟรชรายการรถ
        } else {
          throw new Error(result.message);
        }
      } catch(e) { 
        Swal.fire('เกิดข้อผิดพลาด', e.message, 'error'); 
      }
    });

    // เริ่มการทำงานเมื่อหน้าเว็บโหลดเสร็จ
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
