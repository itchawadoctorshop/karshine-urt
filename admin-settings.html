<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าระบบ - Karshine Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 pb-10">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">⚙️ ตั้งค่าระบบหลังบ้าน</h1>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-orange-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-orange-600 flex justify-between items-center">
        <span><i class="fa-solid fa-car-wash"></i> เมนูบริการร้าน</span>
        <button onclick="addService()" class="bg-orange-500 text-white px-3 py-1 rounded text-sm shadow hover:bg-orange-600">+ เพิ่มบริการ</button>
      </h2>
      <div id="serviceList" class="space-y-4 mb-4 text-sm text-gray-600 italic">กำลังโหลดข้อมูลบริการ...</div>
    </div>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-blue-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-blue-600 flex justify-between items-center">
        <span><i class="fa-solid fa-map-location-dot"></i> รายชื่อสาขา</span>
        <button onclick="addBranch()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm shadow">+ เพิ่มสาขา</button>
      </h2>
      <div id="branchList" class="space-y-2 mb-4 text-sm text-gray-600 italic">กำลังโหลด...</div>
    </div>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-green-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-green-600 flex justify-between items-center">
        <span><i class="fa-solid fa-gift"></i> โปรโมชั่นแพ็กเกจ</span>
        <button onclick="addMasterPkg()" class="bg-green-500 text-white px-3 py-1 rounded text-sm shadow">+ สร้างโปรโมชั่น</button>
      </h2>
      <div id="pkgList" class="space-y-2 mb-4 text-sm text-gray-600 italic">กำลังโหลด...</div>
    </div>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-purple-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-purple-600 flex justify-between items-center">
        <span><i class="fa-solid fa-wallet"></i> วิธีชำระเงิน</span>
        <button onclick="addPayment()" class="bg-purple-500 text-white px-3 py-1 rounded text-sm shadow">+ เพิ่มช่องทาง</button>
      </h2>
      <div id="payList" class="space-y-2 mb-4 text-sm text-gray-600 italic">กำลังโหลด...</div>
    </div>
  </div>

  <script>
    // ⚠️ แก้ไข URL ให้ตรงกับ Google Apps Script ของคุณโอม
    const API_URL = "https://script.google.com/macros/s/AKfycbyTgEm-fiGqCe-aeYPjbizXPMbIKfxQM0_jQHwZK97j3-7eApuhP0S_f9zmlpsrJ5yF/exec";
    
    // เก็บตัวแปรบริการไว้ใช้งานตอนแก้ไข
    let allServices = [];

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getAdminSettings`);
        const data = await res.json();
        if (data.status === 'error') throw new Error(data.message);

        // --- Render Services ---
        const sList = document.getElementById('serviceList');
        if(data.services && data.services.length > 0) {
            allServices = data.services.filter(s => s.status === 'active');
            
            // จัดกลุ่มตามหมวดหมู่
            const grouped = allServices.reduce((acc, obj) => {
              const key = obj.category;
              if (!acc[key]) acc[key] = [];
              acc[key].push(obj);
              return acc;
            }, {});

            let html = '';
            for (const category in grouped) {
                html += `<div class="font-bold text-gray-800 bg-gray-200 px-2 py-1 rounded mt-3 mb-2">${category}</div>`;
                grouped[category].forEach(s => {
                    html += `
                    <div class="p-3 bg-gray-50 border rounded-lg mb-2 relative">
                        <div class="font-bold text-orange-700">${s.service_name}</div>
                        <div class="text-xs text-gray-500 grid grid-cols-3 gap-1 mt-1">
                            <div>M: ${s.price_m}.-</div>
                            <div>L: ${s.price_l}.-</div>
                            <div>XL: ${s.price_xl}.-</div>
                        </div>
                        <div class="text-xs text-blue-600 mt-1"><i class="fa-regular fa-clock"></i> ใช้เวลา ${s.std_time_mins} นาที</div>
                        
                        <div class="absolute top-2 right-2 flex gap-2">
                            <button onclick="editService('${s.service_id}')" class="text-blue-500 hover:text-blue-700"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteService('${s.service_id}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>`;
                });
            }
            sList.innerHTML = html;
        } else {
            sList.innerHTML = 'ยังไม่มีข้อมูลบริการร้าน';
        }

        // --- Render Branches ---
        document.getElementById('branchList').innerHTML = data.branches.length ? data.branches.map(b => `
          <div class="p-3 bg-gray-50 border rounded-lg"><div class="font-bold text-gray-800">${b.branch_name}</div><div class="text-xs text-gray-500">ฟรี ${b.free_km} กม. / กม.ละ ${b.fee_per_km} บ.</div></div>
        `).join('') : 'ยังไม่มีข้อมูลสาขา';

        // --- Render Packages ---
        document.getElementById('pkgList').innerHTML = data.masterPkgs.length ? data.masterPkgs.map(p => `
          <div class="p-3 bg-gray-50 border rounded-lg flex justify-between items-center">
            <div><div class="font-bold text-gray-800">${p.pkg_name}</div><div class="text-xs text-gray-500">${p.amount} ${p.pkg_type === 'count' ? 'ครั้ง' : 'วัน'}</div></div>
            <div class="font-bold text-green-600">${p.price}.-</div>
          </div>
        `).join('') : 'ยังไม่มีโปรโมชั่น';

        // --- Render Payments ---
        document.getElementById('payList').innerHTML = data.payments.length ? data.payments.map(p => `
          <div class="p-3 bg-gray-50 border rounded-lg text-sm"><div class="font-bold text-purple-700">${p.pay_name}</div><div class="text-xs text-gray-500">${p.details}</div></div>
        `).join('') : 'ยังไม่มีวิธีชำระเงิน';

      } catch (e) {
        Swal.fire('ข้อผิดพลาด', 'สาเหตุ: ' + e.message, 'error');
      }
    }

    // ==========================================
    // ฟังก์ชันจัดการบริการ (Services)
    // ==========================================
    async function addService() {
        showServiceForm('add', {});
    }

    function editService(id) {
        const svc = allServices.find(s => s.service_id === id);
        if(svc) showServiceForm('edit', svc);
    }

    async function showServiceForm(actionType, data) {
        const { value: v } = await Swal.fire({
            title: actionType === 'add' ? 'เพิ่มบริการใหม่' : 'แก้ไขบริการ',
            html: `
            <select id="s-cat" class="swal2-input">
                <option value="BASIC" ${data.category==='BASIC'?'selected':''}>BASIC</option>
                <option value="ADD-ON" ${data.category==='ADD-ON'?'selected':''}>ADD-ON</option>
                <option value="PREMIUM" ${data.category==='PREMIUM'?'selected':''}>PREMIUM</option>
                <option value="TOP WRAP" ${data.category==='TOP WRAP'?'selected':''}>TOP WRAP</option>
            </select>
            <input id="s-name" class="swal2-input" placeholder="ชื่อบริการ" value="${data.service_name || ''}">
            
            <textarea id="s-detail" class="swal2-textarea" placeholder="รายละเอียดบริการ (แสดงให้ลูกค้าเห็น)" rows="2" style="margin: 10px auto; width: 80%;">${data.detail || ''}</textarea>

            <div class="flex gap-2 px-4 mt-2">
                <input id="s-pm" type="number" class="swal2-input !w-1/3 !m-0" placeholder="ราคา M" value="${data.price_m || ''}">
                <input id="s-pl" type="number" class="swal2-input !w-1/3 !m-0" placeholder="ราคา L" value="${data.price_l || ''}">
                <input id="s-pxl" type="number" class="swal2-input !w-1/3 !m-0" placeholder="ราคา XL" value="${data.price_xl || ''}">
            </div>
            <input id="s-time" type="number" class="swal2-input" placeholder="เวลามาตรฐาน (นาที)" value="${data.std_time_mins || ''}">
            `,
            focusConfirm: false,
            preConfirm: () => {
                return {
                    id: actionType === 'add' ? 'SRV-' + Date.now() : data.service_id,
                    actionType: actionType,
                    category: document.getElementById('s-cat').value,
                    name: document.getElementById('s-name').value,
                    detail: document.getElementById('s-detail').value, // รับค่า Detail
                    priceM: document.getElementById('s-pm').value || 0,
                    priceL: document.getElementById('s-pl').value || 0,
                    priceXL: document.getElementById('s-pxl').value || 0,
                    stdTime: document.getElementById('s-time').value || 30
                };
            }
        });

        if (v && v.name) {
            const url = `${API_URL}?action=manageService&actionType=${v.actionType}&id=${v.id}&category=${encodeURIComponent(v.category)}&name=${encodeURIComponent(v.name)}&detail=${encodeURIComponent(v.detail)}&priceM=${v.priceM}&priceL=${v.priceL}&priceXL=${v.priceXL}&stdTime=${v.stdTime}`;
            await callApi(url, actionType === 'add' ? 'เพิ่มบริการเรียบร้อย' : 'แก้ไขสำเร็จ');
        }
    }

    // 🛡️ อัปเกรดระบบลบ ต้องพิมพ์คำว่า ยืนยัน กันมือลั่น
    async function deleteService(id) {
        const { value: confirmText } = await Swal.fire({
            title: 'ยืนยันการลบข้อมูล?',
            html: '<p class="text-sm text-gray-600 mb-3">หากต้องการลบบริการนี้<br>โปรดพิมพ์คำว่า <b>ยืนยัน</b> ลงในช่องด้านล่าง</p>',
            input: 'text',
            inputPlaceholder: 'พิมพ์คำว่า ยืนยัน',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            confirmButtonText: 'ลบข้อมูล',
            cancelButtonText: 'ยกเลิก',
            inputValidator: (value) => {
                if (value !== 'ยืนยัน') {
                    return 'คุณพิมพ์ไม่ถูกต้อง โปรดพิมพ์คำว่า ยืนยัน';
                }
            }
        });

        if (confirmText === 'ยืนยัน') {
            const url = `${API_URL}?action=manageService&actionType=delete&id=${id}`;
            await callApi(url, 'ลบบริการเรียบร้อย');
        }
    }

    // ฟังก์ชันกลางในการยิง API (เหมือนเดิม)
    async function callApi(url, successMsg) {
      Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === 'success') {
          setTimeout(() => { Swal.fire('สำเร็จ', successMsg, 'success'); loadData(); }, 1000);
        } else {
          throw new Error(data.message);
        }
      } catch (e) {
        Swal.fire('ข้อผิดพลาด', e.message, 'error');
      }
    }

    // เพิ่มสาขา แพ็กเกจ และชำระเงิน (ตัดมาให้สั้นลง แต่ทำงานเหมือนเดิม)
    async function addBranch() { /* ...โค้ดเดิม... */ }
    async function addMasterPkg() { /* ...โค้ดเดิม... */ }
    async function addPayment() { /* ...โค้ดเดิม... */ }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
