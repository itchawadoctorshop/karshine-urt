<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าระบบ - Karshine Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">⚙️ ตั้งค่าระบบหลังบ้าน</h1>

    <div class="bg-white rounded-xl shadow p-5 mb-6">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-blue-600">📍 จัดการสาขา</h2>
      <div id="branchList" class="space-y-2 mb-4"></div>
      <button onclick="addBranch()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm">+ เพิ่มสาขาใหม่</button>
    </div>

    <div class="bg-white rounded-xl shadow p-5 mb-6">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-green-600">🎁 ตั้งค่าแพ็กเกจแม่แบบ</h2>
      <div id="pkgList" class="space-y-2 mb-4"></div>
      <button onclick="addMasterPkg()" class="w-full bg-green-600 text-white py-2 rounded-lg text-sm">+ สร้างโปรโมชั่นใหม่</button>
    </div>
  </div>

  <script>
    const API_URL = "ใส่_URL_WEB_APP_ของคุณ_ที่นี่";

    async function loadData() {
      const res = await fetch(`${API_URL}?action=getAdminSettings`);
      const data = await res.json();
      
      // แสดงรายการสาขา
      const bList = document.getElementById('branchList');
      bList.innerHTML = data.branches.map(b => `
        <div class="p-2 bg-gray-50 border rounded text-sm">
          <b>${b.branch_name}</b> (ฟรี ${b.free_km} กม.)
        </div>
      `).join('');

      // แสดงรายการแพ็กเกจ
      const pList = document.getElementById('pkgList');
      pList.innerHTML = data.masterPkgs.map(p => `
        <div class="p-2 bg-gray-50 border rounded text-sm">
          <b>${p.pkg_name}</b> - ${p.price}.- (${p.amount} ${p.pkg_type === 'count' ? 'ครั้ง' : 'วัน'})
        </div>
      `).join('');
    }

    async function addMasterPkg() {
      const { value: formValues } = await Swal.fire({
        title: 'สร้างโปรโมชั่นใหม่',
        html:
          '<input id="swal-name" class="swal2-input" placeholder="ชื่อแพ็กเกจ">' +
          '<select id="swal-type" class="swal2-input"><option value="count">นับจำนวนครั้ง</option><option value="buffet">บุฟเฟต์ (รายวัน)</option></select>' +
          '<input id="swal-amount" type="number" class="swal2-input" placeholder="จำนวนครั้ง/วัน">' +
          '<input id="swal-price" type="number" class="swal2-input" placeholder="ราคา">',
        focusConfirm: false,
        preConfirm: () => [
          document.getElementById('swal-name').value,
          document.getElementById('swal-type').value,
          document.getElementById('swal-amount').value,
          document.getElementById('swal-price').value
        ]
      });

      if (formValues) {
        const [name, type, amount, price] = formValues;
        const id = 'MP-' + Date.now();
        await fetch(`${API_URL}?action=saveMasterPkg&id=${id}&name=${encodeURIComponent(name)}&type=${type}&amount=${amount}&price=${price}`);
        Swal.fire('สำเร็จ', 'บันทึกโปรโมชั่นแล้ว', 'success');
        loadData();
      }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
