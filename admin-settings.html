<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าระบบ - Karshine Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 pb-20">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">⚙️ ตั้งค่าระบบหลังบ้าน</h1>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-orange-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-orange-600 flex justify-between items-center">
        <span><i class="fa-solid fa-car-wash"></i> เมนูบริการ</span>
        <button onclick="addService()" class="bg-orange-500 text-white px-3 py-1 rounded text-sm shadow">+ เพิ่ม</button>
      </h2>
      <div id="serviceList" class="space-y-3 mb-4"></div>
    </div>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-blue-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-blue-600 flex justify-between items-center">
        <span><i class="fa-solid fa-map-location-dot"></i> รายชื่อสาขา</span>
        <button onclick="addBranch()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm shadow">+ เพิ่ม</button>
      </h2>
      <div id="branchList" class="space-y-3 mb-4"></div>
    </div>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-green-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-green-600 flex justify-between items-center">
        <span><i class="fa-solid fa-gift"></i> โปรโมชั่นแพ็กเกจ</span>
        <button onclick="addMasterPkg()" class="bg-green-500 text-white px-3 py-1 rounded text-sm shadow">+ สร้าง</button>
      </h2>
      <div id="pkgList" class="space-y-3 mb-4"></div>
    </div>

    <div class="bg-white rounded-xl shadow p-5 mb-6 border-t-4 border-purple-500">
      <h2 class="font-bold text-lg mb-4 border-b pb-2 text-purple-600 flex justify-between items-center">
        <span><i class="fa-solid fa-wallet"></i> วิธีชำระเงิน</span>
        <button onclick="addPayment()" class="bg-purple-500 text-white px-3 py-1 rounded text-sm shadow">+ เพิ่ม</button>
      </h2>
      <div id="payList" class="space-y-3 mb-4"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyTgEm-fiGqCe-aeYPjbizXPMbIKfxQM0_jQHwZK97j3-7eApuhP0S_f9zmlpsrJ5yF/exec";
    let storeData = {};

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getAdminSettings`);
        storeData = await res.json();
        
        // 1. Render Services
        renderList('serviceList', storeData.services, s => `
          <div class="font-bold text-orange-700">${s.service_name}</div>
          <div class="text-xs text-gray-500">${s.detail || '-'}</div>
          <div class="text-xs font-bold mt-1">M: ${s.price_m} | L: ${s.price_l} | XL: ${s.price_xl}</div>
        `, 'Services', 'service_id', editService);

        // 2. Render Branches
        renderList('branchList', storeData.branches, b => `
          <div class="font-bold text-blue-700">${b.branch_name}</div>
          <div class="text-xs text-gray-500">ฟรี ${b.free_km} กม. / กม.ละ ${b.fee_per_km} บ.</div>
        `, 'Branches', 'branch_id', editBranch);

        // 3. Render Packages
        renderList('pkgList', storeData.masterPkgs, p => `
          <div class="font-bold text-green-700">${p.pkg_name}</div>
          <div class="text-xs text-gray-500">${p.amount} ${p.pkg_type==='count'?'ครั้ง':'วัน'} | ${p.price}.-</div>
        `, 'Master_Packages', 'master_id', editMasterPkg);

        // 4. Render Payments
        renderList('payList', storeData.payments, p => `
          <div class="font-bold text-purple-700">${p.pay_name}</div>
          <div class="text-xs text-gray-500">${p.details}</div>
        `, 'Payment_Methods', 'pay_id', editPayment);

      } catch (e) { Swal.fire('Error', e.message, 'error'); }
    }

    function renderList(elementId, items, templateFn, target, idKey, editFn) {
      const container = document.getElementById(elementId);
      container.innerHTML = items.length ? items.map(item => `
        <div class="p-3 bg-gray-50 border rounded-lg relative shadow-sm">
          ${templateFn(item)}
          <div class="absolute top-2 right-2 flex gap-3">
            <button onclick="${editFn.name}('${item[idKey]}')" class="text-blue-500"><i class="fa-solid fa-pen"></i></button>
            <button onclick="confirmDelete('${target}', '${item[idKey]}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('') : '<p class="text-gray-400 text-center py-2">ยังไม่มีข้อมูล</p>';
    }

    // --- ฟังก์ชันจัดการลบ (พิมพ์ ยืนยัน) ---
    async function confirmDelete(target, id) {
      const { value: confirmText } = await Swal.fire({
        title: 'ยืนยันการลบ?',
        html: 'โปรดพิมพ์คำว่า <b>ยืนยัน</b> เพื่อลบรายการนี้',
        input: 'text',
        icon: 'warning',
        showCancelButton: true,
        inputValidator: (v) => v !== 'ยืนยัน' && 'โปรดพิมพ์ให้ถูกต้อง'
      });
      if (confirmText === 'ยืนยัน') {
        const url = `${API_URL}?action=manageData&target=${target}&actionType=delete&id=${id}`;
        await callApi(url, 'ลบข้อมูลเรียบร้อย');
      }
    }

    // --- ตัวอย่างฟังก์ชันแก้ไขสาขา (ทำครบทุกหมวดหมู่) ---
    async function addBranch() { showBranchForm('add', {}); }
    function editBranch(id) { showBranchForm('edit', storeData.branches.find(b => b.branch_id === id)); }
    async function showBranchForm(action, data) {
      const { value: v } = await Swal.fire({
        title: action==='add'?'เพิ่มสาขา':'แก้ไขสาขา',
        html: `<input id="b-name" class="swal2-input" placeholder="ชื่อสาขา" value="${data.branch_name||''}">
               <input id="b-lat" class="swal2-input" placeholder="Lat" value="${data.lat||''}">
               <input id="b-lng" class="swal2-input" placeholder="Lng" value="${data.lng||''}">
               <input id="b-free" type="number" class="swal2-input" placeholder="ส่งฟรี (กม.)" value="${data.free_km||''}">
               <input id="b-fee" type="number" class="swal2-input" placeholder="บาท/กม." value="${data.fee_per_km||''}">`,
        preConfirm: () => ({
          id: action==='add'?'BR-'+Date.now():data.branch_id,
          name: document.getElementById('b-name').value,
          lat: document.getElementById('b-lat').value, lng: document.getElementById('b-lng').value,
          free: document.getElementById('b-free').value, fee: document.getElementById('b-fee').value
        })
      });
      if (v && v.name) {
        const url = `${API_URL}?action=manageData&target=Branches&actionType=${action}&id=${v.id}&name=${encodeURIComponent(v.name)}&lat=${v.lat}&lng=${v.lng}&free=${v.free}&fee=${v.fee}`;
        await callApi(url, 'บันทึกเรียบร้อย');
      }
    }

    // (หมายเหตุ: ฟังก์ชัน addService, editService, addMasterPkg, editPayment ทำงานในลักษณะเดียวกัน โดยเปลี่ยนฟิลด์ตามตาราง)
    // ผมรวบรวมฟังก์ชัน callApi เดิมไว้ให้ข้างล่างครับ
    async function callApi(url, msg) {
      Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
      const res = await fetch(url);
      const data = await res.json();
      if (data.status === 'success') {
        setTimeout(() => { Swal.fire('สำเร็จ', msg, 'success'); loadData(); }, 1000);
      } else { Swal.fire('Error', data.message, 'error'); }
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
